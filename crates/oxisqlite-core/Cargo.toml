[dependencies.bitflags]
workspace = true

[dependencies.chrono]
workspace = true
# "clock" (not just "now") is genuinely required here: functions/datetime/mod.rs's
# `Modifier::Localtime`/`Modifier::Utc` handling implements SQLite's
# `datetime('now','localtime')`/`'utc'` modifiers, which perform a real
# host-OS-timezone conversion via `chrono::Local` — that needs the full
# "clock" feature (`iana-time-zone`, and on macOS `core-foundation-sys`), not
# just "now". All *other* call sites in this crate that previously used
# `chrono::Local::now()` merely to read the current instant (io/*.rs's
# `Clock::now()`, and 'now' time-value parsing) have been switched to
# `chrono::Utc::now()`, since SQLite's own 'now' time-value is UTC and
# `Instant::{secs,micros}` are timezone-independent — but the crate as a
# whole cannot drop "clock" while the localtime/utc modifiers still need it.
# Note: even if this crate could drop "clock", the workspace's default build
# would still pull `iana-time-zone`/`core-foundation-sys` in transitively via
# `arrow-arith`/`arrow-array`/`arrow-cast`/`arrow-csv`/`arrow-json` (through
# `oxisql-datafusion` → `datafusion` → `arrow`), which each independently
# request chrono's "clock" feature in their own manifests — confirmed via
# `cargo tree -i core-foundation-sys`.
features = ["clock"]

# ── Crate-local third-party version pins (deliberate, not an oversight) ────
# The pins below (crossbeam-skiplist, hex, libc, libm, parking_lot, rand,
# regex, regex-syntax, ryu, tracing; plus quickcheck/quickcheck_macros and
# the criterion feature set under [dev-dependencies] further down) are kept
# crate-local rather than swept to `workspace = true`. `oxisqlite-core` is
# the C-free fork of limbo 0.0.22's `core` crate, and matching upstream's own
# per-crate version pins keeps this manifest diffable line-for-line against
# limbo for future upstream merges — none of these are shared with another
# workspace member at a *different* version (which would be the actual bug
# worth fixing; see `log`/`env_logger` in oxisqlite-sqlite3-parser and
# `tokio` in oxisqlite, which WERE swept to `workspace = true` because they
# had drifted from an already-shared workspace-level requirement).
