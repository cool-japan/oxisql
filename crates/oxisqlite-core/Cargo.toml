    "dep:polling",
    "dep:rustix",
]
omit_autovacuum = []
serde = ["dep:serde"]
simulator = [
    "fuzz",
    "serde",
]
static = ["limbo_ext/static"]
time = ["limbo_time/static"]
uuid = ["limbo_uuid/static"]

