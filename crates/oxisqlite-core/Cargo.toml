[features]
default = [
    "fs",
    "uuid",
    "time",
    "json",
    "static",
]
fs = ["limbo_ext/vfs"]
fuzz = []
index_experimental = []
io_uring = [
    "native-io",
    "dep:io-uring",
    "rustix/io_uring",
    "dep:libc",
]
json = []
# Off-by-default: dynamic (dlopen) SQL extension loading via `libloading`.
# Quarantined so the default dependency closure carries no dlopen/FFI loader.
load-extension = ["dep:libloading"]
# Off-by-default: native epoll/kqueue event-loop I/O backend (`unix`, via
# polling + rustix -> linux-raw-sys on Linux). The default build uses the pure
# std-blocking `generic` backend instead; this is the perf vs. purity trade-off.
native-io = [
    "dep:polling",
    "dep:rustix",
]
omit_autovacuum = []
serde = ["dep:serde"]
simulator = [
    "fuzz",
    "serde",
]
static = ["limbo_ext/static"]
time = ["limbo_time/static"]
uuid = ["limbo_uuid/static"]

[target.'cfg(not(target_family = "wasm"))'.dependencies.libloading]
version = "0.9.0"
optional = true


[target.'cfg(not(target_family = "windows"))'.dev-dependencies.pprof]
version = "0.15.0"
features = [
    "criterion",
    "flamegraph",
]

[target.'cfg(target_family = "unix")'.dependencies.polling]
version = "3.11.0"
optional = true

[target.'cfg(target_family = "unix")'.dependencies.rustix]
version = "1.1.4"
features = ["fs"]
optional = true

[target.'cfg(target_os = "linux")'.dependencies.io-uring]
version = "0.7.12"
optional = true
