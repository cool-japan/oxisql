[package]
name = "oxisql-embedded"
version.workspace = true
edition.workspace = true
authors.workspace = true
license.workspace = true
repository.workspace = true
rust-version.workspace = true
description = "Embedded in-memory SQL backend for OxiSQL — powered by GlueSQL"
readme = "README.md"
categories = ["database", "embedded"]
keywords = ["database", "sql", "in-memory", "gluesql", "oxisql"]

[features]
# Enable SledGlueStorage: persistent embedded SQL backed by sled (Pure Rust).
# Uses hand-rolled serde_json serialisation (no bincode) to comply with
# the COOLJAPAN no-bincode policy.
sled-storage = ["dep:sled", "dep:serde_json", "dep:ordered-float"]
# Enable FjallGlueStorage: persistent embedded SQL backed by the fjall LSM-tree.
fjall-storage = ["dep:fjall", "dep:serde_json"]
# Enable RedbGlueStorage: persistent embedded SQL backed by redb (pure Rust).
redb-storage = ["dep:redb", "dep:serde_json", "dep:ordered-float", "dep:rust_decimal"]

[dependencies]
oxisql-core.workspace = true
oxisql-parse.workspace = true
async-trait.workspace = true
futures.workspace = true
tokio.workspace = true
gluesql.workspace = true
chrono.workspace = true
sqlparser = { workspace = true, features = ["std", "visitor"] }
# Optional persistent storage backends
fjall         = { workspace = true, optional = true }
serde_json    = { workspace = true, optional = true }
redb          = { workspace = true, optional = true }
ordered-float = { workspace = true, optional = true }
rust_decimal  = { workspace = true, optional = true }
sled          = { workspace = true, optional = true }

[dev-dependencies]
tokio = { workspace = true, features = ["rt-multi-thread"] }
criterion = { workspace = true }

[[bench]]
name = "embedded_benchmarks"
harness = false

