[package]
edition.workspace = true
name = "oxisqlite"
version.workspace = true
authors = ["the Limbo authors"]
build = false
autolib = false
autobins = false
autoexamples = false
autotests = false
autobenches = false
description = "oxisqlite Pure-Rust SQLite-compatible engine (C-free fork of limbo)"
readme = "README.md"
categories = ["database", "embedded"]
keywords = ["sqlite", "sql", "database", "embedded", "limbo"]
license.workspace = true
repository.workspace = true

[lib]
name = "limbo"
path = "src/lib.rs"

[[example]]
name = "example"
path = "examples/example.rs"

[[test]]
name = "integration_tests"
path = "tests/integration_tests.rs"

# Use oxisqlite-core's pure, std-blocking default I/O backend so the default
# dependency closure stays free of `-sys` crates. The native event-loop /
# io_uring backends are opt-in via the forwarding features below.
[dependencies.limbo_core]
package = "oxisqlite-core"
version = "0.4.2"
path = "../oxisqlite-core"

[dependencies.thiserror]
workspace = true

[dev-dependencies.tempfile]
workspace = true

[dev-dependencies.tokio]
workspace = true
features = ["full"]

[features]
index_experimental = ["limbo_core/index_experimental"]
# Opt-in: native epoll/kqueue event-loop I/O backend (pulls platform `-sys`
# crates, e.g. linux-raw-sys; see oxisqlite-core). Off by default.
native-io = ["limbo_core/native-io"]
# Opt-in: Linux io_uring backend (implies native-io). Off by default.
io_uring = ["limbo_core/io_uring"]
# Opt-in: dynamic (dlopen) SQL extension loading. Off by default.
load-extension = ["limbo_core/load-extension"]
