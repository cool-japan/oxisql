[workspace]
resolver = "2"
members = [
    "crates/oxisql-core",
    "crates/oxisql-parse",
    "crates/oxisql-embedded",
    "crates/oxisql-postgres",
    "crates/oxisql-mysql",
    "crates/oxisql-datafusion",
    "crates/oxisql-pool",
    "crates/oxisql-migrate",
    "crates/oxisql-sqlite-compat",
    "crates/oxisql",
    # oxisqlite C-stripped fork (formerly vendor/limbo)
    "crates/oxisqlite",
    "crates/oxisqlite-core",
    "crates/oxisqlite-ext",
    "crates/oxisqlite-macros",
    "crates/oxisqlite-sqlite3-parser",
    "crates/oxisqlite-time",
    "crates/oxisqlite-uuid",
]

[workspace.package]
version = "0.3.2"
edition = "2021"
rust-version = "1.89"
authors = ["COOLJAPAN OU (Team Kitasan)"]
license = "Apache-2.0"
repository = "https://github.com/cool-japan/oxisql"
description = "OxiSQL is the COOLJAPAN-blessed Pure-Rust database layer: a unified SQL surface that spans embedded engines, OLTP wire-protocol clients (Postgres, MySQL), and a SQLite-compatible embedded path — without `libpq`, `mysqlclient`, `libsqlite3`, or any C/C++ DB driver."

[workspace.dependencies]
oxisql-core           = { path = "crates/oxisql-core",           version = "0.3" }
oxisql-parse          = { path = "crates/oxisql-parse",          version = "0.3" }
oxisql-embedded       = { path = "crates/oxisql-embedded",       version = "0.3" }
oxisql-postgres       = { path = "crates/oxisql-postgres",       version = "0.3" }
oxisql-mysql          = { path = "crates/oxisql-mysql",          version = "0.3" }
oxisql-datafusion     = { path = "crates/oxisql-datafusion",     version = "0.3" }
oxisql-pool           = { path = "crates/oxisql-pool",           version = "0.3" }
oxisql-migrate        = { path = "crates/oxisql-migrate",        version = "0.3" }
oxisql-sqlite-compat  = { path = "crates/oxisql-sqlite-compat",  version = "0.3" }

# DataFusion backend — default-features=false avoids parquet/compression *-sys crates
# arrow must match the version datafusion 54 (latest release) re-exports: 58.3.0.
# This forces oxistore-columnar to stay on the 0.1.x line (0.1.3): its 0.2.0 moved
# to arrow/parquet 59.0.0, which conflicts with datafusion 54 (two arrow versions →
# E0308 in oxisql-datafusion). Do NOT bump oxistore-columnar to 0.2.x until a
# datafusion release built on arrow 59 exists.
datafusion            = { version = "54.0.0", default-features = false, features = ["sql"] }
datafusion-datasource = { version = "54.0.0", default-features = false }
arrow                 = { version = "58.3.0" }
thiserror  = { version = "2.0.18" }

async-trait = { version = "0.1.89" }
tokio       = { version = "1.52.3", features = ["rt-multi-thread", "macros", "sync", "time"] }
sqlparser   = { version = "0.62.0", default-features = false }
gluesql     = { version = "0.19.0", default-features = false, features = ["gluesql_memory_storage"] }

# Postgres backend (Pure Rust, no libpq/openssl-sys/native-tls)
tokio-postgres          = { version = "0.7.18", default-features = false, features = ["runtime", "with-time-0_3", "with-uuid-1"] }
tokio-postgres-rustls   = { version = "0.14.0", default-features = false }
rustls                  = { version = "0.23", default-features = false, features = ["std", "tls12"] }
rustls-pki-types        = { version = "1" }
rustls-pemfile          = { version = "2" }
tokio-rustls            = { version = "0.26", default-features = false, features = ["tls12"] }
rustls-rustcrypto       = { version = "0.0.2-alpha" }
oxitls                  = { version = "0.2.0", default-features = false, features = ["pure", "webpki-roots"] }
bytes                   = { version = "1" }
time                    = { version = "0.3.53", default-features = false, features = ["std", "formatting", "macros"] }
tracing                 = { version = "0.1" }
tracing-subscriber      = { version = "0.3", default-features = false, features = ["fmt", "std"] }
uuid                    = { version = "1.23.4" }

# MySQL backend (Pure Rust, no libmysqlclient/mysqlclient-sys/openssl-sys)
# default-features=false avoids libz-sys; minimal-rust + rustls-tls gives a
# fully pure Rust build with rustls-based TLS.
mysql_async = { version = "0.37.0", default-features = false, features = ["minimal-rust", "rustls-tls"] }
chrono      = { version = "0.4", default-features = false, features = ["std"] }

# Connection pooling — Pure Rust, deadpool for generic pool + deadpool-postgres wrapper
deadpool          = { version = "0.13.0" }
deadpool-postgres  = { version = "0.14.1" }

futures = { version = "0.3" }

# LRU cache
lru = { version = "0.18.0" }

# Logging
log = { version = "0.4" }

# CLI support
clap   = { version = "4", features = ["derive"] }
anyhow = { version = "1" }

# oxisqlite — Pure-Rust SQLite-compatible engine (C-stripped fork of limbo 0.0.22; no C/C++ deps)
# index_experimental enables CREATE INDEX support
oxisqlite = { path = "crates/oxisqlite", version = "0.3", features = ["index_experimental"] }

# oxisqlite-* family — shared third-party deps (oxisqlite-core, oxisqlite-sqlite3-parser,
# oxisqlite-time, oxisqlite-ext)
strum             = { version = "0.28.0" }
strum_macros      = { version = "0.28.0" }
tempfile          = { version = "3.27.0" }
bitflags          = { version = "2.13.0" }
fallible-iterator = { version = "0.3.0" }
getrandom         = { version = "0.4.3" }
miette            = { version = "7.6.0" }
serde             = { version = "1.0", features = ["derive"] }
uncased           = { version = "0.9.10" }
env_logger        = { version = "0.11.11" }

# Persistent embedded storage — fjall LSM-tree (Pure Rust, optional)
fjall = { version = "3.1.5" }

# Persistent embedded storage — redb B-tree engine (Pure Rust, optional)
redb          = { version = "4.1.0" }
ordered-float = { version = "5", features = ["serde"] }
rust_decimal  = { version = "1", features = ["serde"] }

# Persistent embedded storage — sled key-value engine (Pure Rust, optional)
sled = { version = "0.34.7" }

# Benchmarking
criterion = { version = "0.8.2", features = ["html_reports", "async_tokio"] }

# Test utilities
proptest  = { version = "1.11.0", default-features = false, features = ["std"] }
serde_json = { version = "1" }

# OxiStore columnar Parquet backend (Pure Rust, optional)
# Pinned to the 0.1.x line — see the arrow/datafusion note above before bumping to 0.2.x.
# Re-confirmed 2026-07-02: oxistore-columnar 0.2.0 bundles arrow/parquet 59.0.0,
# which conflicts with datafusion 54.0.0's internal arrow ^58 requirement.
# oxisql-datafusion/src/parquet.rs bridges oxistore_columnar::{Schema,RecordBatch}
# directly into datafusion/arrow types by relying on identical arrow versions;
# bumping to 0.2.0 breaks that bridge with E0308 (two `arrow_schema` versions in
# the dependency graph). See ~/work/cargo-upgrade/oxisql.toml for the tracked skip.
oxistore-columnar = { version = "0.1.3" }

# ── Security patches ───────────────────────────────────────────────────────────
# RUSTSEC-2026-0104: rustls-webpki 0.102.x panic in CRL parsing.
# rustls-rustcrypto 0.0.2-alpha pins webpki = "0.102.0" (no newer release yet).
# This local patch removes the webpki dep and routes alg_id through pki-types,
# allowing Cargo to resolve rustls-webpki >= 0.103.13 for all other consumers.
[patch.crates-io]
rustls-rustcrypto = { path = "crates/rustls-rustcrypto-patched" }
# Pure-Rust patch: drop objc2-system-configuration (macOS SCDynamicStore) from
# whoami's std feature — pulled via tokio-postgres; see COOLJAPAN Pure Rust Policy v2 §3 Role-A.
whoami = { path = "crates/whoami-patched" }
# Pure-Rust patch: replace the C-FFI `zstd` (zstd-sys) with a pure shim backed by
# oxiarc-zstd; arrow-ipc (via datafusion) is the only consumer (COOLJAPAN Pure Rust v2).
zstd = { path = "crates/zstd-shim" }

