[workspace]
resolver = "2"
members = [
    "crates/oxisql-core",
    "crates/oxisql-parse",
    "crates/oxisql-embedded",
    "crates/oxisql-postgres",
    "crates/oxisql-mysql",
    "crates/oxisql-datafusion",
    "crates/oxisql-pool",
    "crates/oxisql-migrate",
    "crates/oxisql-sqlite-compat",
    "crates/oxisql-cache",
    "crates/oxisql",
    # oxisqlite C-stripped fork (formerly vendor/limbo)
    "crates/oxisqlite",
    "crates/oxisqlite-core",
    "crates/oxisqlite-ext",
    "crates/oxisqlite-macros",
    "crates/oxisqlite-sqlite3-parser",
    "crates/oxisqlite-time",
    "crates/oxisqlite-uuid",
]

[workspace.package]
version = "0.4.1"
edition = "2021"
rust-version = "1.89"
authors = ["COOLJAPAN OU (Team Kitasan)"]
license = "Apache-2.0"
repository = "https://github.com/cool-japan/oxisql"
description = "OxiSQL is the COOLJAPAN-blessed Pure-Rust database layer: a unified SQL surface that spans embedded engines, OLTP wire-protocol clients (Postgres, MySQL), and a SQLite-compatible embedded path — without `libpq`, `mysqlclient`, `libsqlite3`, or any C/C++ DB driver."

[workspace.dependencies]
oxisql-core           = { path = "crates/oxisql-core",           version = "0.4.1" }
oxisql-parse          = { path = "crates/oxisql-parse",          version = "0.4.1" }
oxisql-embedded       = { path = "crates/oxisql-embedded",       version = "0.4.1" }
oxisql-postgres       = { path = "crates/oxisql-postgres",       version = "0.4.1" }
oxisql-mysql          = { path = "crates/oxisql-mysql",          version = "0.4.1" }
oxisql-datafusion     = { path = "crates/oxisql-datafusion",     version = "0.4.1" }
oxisql-pool           = { path = "crates/oxisql-pool",           version = "0.4.1" }
oxisql-migrate        = { path = "crates/oxisql-migrate",        version = "0.4.1" }
oxisql-sqlite-compat  = { path = "crates/oxisql-sqlite-compat",  version = "0.4.1" }
oxisql-cache          = { path = "crates/oxisql-cache",          version = "0.4.1" }

# DataFusion backend — default-features=false avoids parquet/compression *-sys crates
# arrow must match the version datafusion 54 (latest release) re-exports: 58.3.0.
# This forces oxistore-columnar to stay on the 0.1.x line (0.1.3): its 0.2.0 moved
# to arrow/parquet 59.0.0, which conflicts with datafusion 54 (two arrow versions →
# E0308 in oxisql-datafusion). Do NOT bump oxistore-columnar to 0.2.x until a
# datafusion release built on arrow 59 exists.
datafusion            = { version = "54.0.0", default-features = false, features = ["sql"] }
datafusion-datasource = { version = "54.0.0", default-features = false }
arrow                 = { version = "58.3.0" }
thiserror  = { version = "2.0.18" }

async-trait = { version = "0.1.89" }
tokio       = { version = "1.52.3", features = ["rt-multi-thread", "macros", "sync", "time"] }
sqlparser   = { version = "0.62.0", default-features = false }
gluesql     = { version = "0.19.0", default-features = false, features = ["gluesql_memory_storage"] }

# Postgres backend (Pure Rust, no libpq/openssl-sys/native-tls)
tokio-postgres          = { version = "0.7.18", default-features = false, features = ["runtime", "with-time-0_3", "with-uuid-1"] }
tokio-postgres-rustls   = { version = "0.14.0", default-features = false }
postgres-protocol       = { version = "0.6.12" }
# `postgres-protocol` 0.6.12 is compiled against the `fallible-iterator` 0.2.x
# line (its `ErrorResponseBody::fields()` / `AuthenticationSaslBody::mechanisms()`
# return a `fallible_iterator::FallibleIterator` from that major version), which
# is semver-incompatible with the `fallible-iterator = "0.3.0"` pinned below for
# `oxisqlite-core` / `oxisqlite-sqlite3-parser`. This alias imports the *same*
# 0.2.0 already resolved transitively in Cargo.lock (via `tokio-postgres`/
# `postgres-protocol` themselves) under a distinct local name, so
# `oxisql-postgres` can depend on it directly without a version conflict and
# without introducing any new resolved dependency version.
fallible-iterator-02    = { package = "fallible-iterator", version = "0.2" }
rustls                  = { version = "0.23", default-features = false, features = ["std", "tls12"] }
rustls-pki-types        = { version = "1" }
rustls-pemfile          = { version = "2" }
tokio-rustls            = { version = "0.26", default-features = false, features = ["tls12"] }
oxitls                  = { version = "0.3.0", default-features = false, features = ["pure", "webpki-roots"] }
bytes                   = { version = "1" }
time                    = { version = "0.3.53", default-features = false, features = ["std", "formatting", "macros"] }
tracing                 = { version = "0.1" }
tracing-subscriber      = { version = "0.3", default-features = false, features = ["fmt", "std"] }
uuid                    = { version = "1.23.4" }

# MySQL backend (Pure Rust, no libmysqlclient/mysqlclient-sys/openssl-sys)
# default-features=false avoids libz-sys; minimal-rust + rustls-tls gives a
# fully pure Rust build with rustls-based TLS.
mysql_async = { version = "0.37.0", default-features = false, features = ["minimal-rust", "rustls-tls"] }
chrono      = { version = "0.4", default-features = false, features = ["std"] }

# Connection pooling — Pure Rust, deadpool for generic pool + deadpool-postgres wrapper
deadpool          = { version = "0.13.0" }
deadpool-postgres  = { version = "0.14.1" }

futures = { version = "0.3" }

# LRU cache
lru = { version = "0.18.0" }

# Logging
log = { version = "0.4" }

# CLI support
clap   = { version = "4", features = ["derive"] }
anyhow = { version = "1" }

# oxisqlite — Pure-Rust SQLite-compatible engine (C-stripped fork of limbo 0.0.22; no C/C++ deps)
# index_experimental enables CREATE INDEX support
oxisqlite = { path = "crates/oxisqlite", version = "0.4.1", features = ["index_experimental"] }

# limbo_ext / limbo_macros — path-renamed local crates (rename of oxisqlite-ext /
# oxisqlite-macros via `package =`); internal source still says `use limbo_ext::...`
# / `use limbo_macros::...`. Consumed by oxisqlite-core, oxisqlite-time, oxisqlite-uuid
# (limbo_ext) and oxisqlite-core, oxisqlite-ext (limbo_macros).
limbo_ext    = { package = "oxisqlite-ext",    path = "crates/oxisqlite-ext",    version = "0.4.1" }
limbo_macros = { package = "oxisqlite-macros", path = "crates/oxisqlite-macros", version = "0.4.1" }

# oxisqlite-* family — shared third-party deps (oxisqlite-core, oxisqlite-sqlite3-parser,
# oxisqlite-time, oxisqlite-ext)
strum             = { version = "0.28.0" }
strum_macros      = { version = "0.28.0" }
tempfile          = { version = "3.27.0" }
bitflags          = { version = "2.13.0" }
fallible-iterator = { version = "0.3.0" }
getrandom         = { version = "0.4.3" }
miette            = { version = "7.6.0" }
serde             = { version = "1.0", features = ["derive"] }
uncased           = { version = "0.9.10" }
env_logger        = { version = "0.11.11" }

# oxisqlite-core — Windows-only file-locking backend (io/windows.rs), calling
# LockFileEx/UnlockFileEx directly. Consumed only behind
# `[target.'cfg(target_os = "windows")'.dependencies.windows-sys]` in
# oxisqlite-core's Cargo.toml, so it never enters the dependency graph (or
# affects the Pure Rust default closure) on non-Windows targets.
windows-sys = { version = "0.61.2", features = ["Win32_Foundation", "Win32_Storage_FileSystem", "Win32_System_IO"] }

# Persistent embedded storage — fjall LSM-tree (Pure Rust, optional)
fjall = { version = "3.1.5" }

# Persistent embedded storage — redb B-tree engine (Pure Rust, optional)
redb          = { version = "4.1.0" }
ordered-float = { version = "5", features = ["serde"] }
rust_decimal  = { version = "1", features = ["serde"] }

# Persistent embedded storage — sled key-value engine (Pure Rust, optional)
sled = { version = "0.34.7" }

# Benchmarking
criterion = { version = "0.8.2", features = ["html_reports", "async_tokio"] }

# Test utilities
proptest  = { version = "1.11.0", default-features = false, features = ["std"] }
serde_json = { version = "1" }

# OxiStore columnar Parquet backend (Pure Rust, optional)
# Pinned to the 0.1.x line — see the arrow/datafusion note above before bumping to 0.2.x.
# Re-confirmed 2026-08-04 (skip-ledger check, prior `until = 2026-08-02` had
# lapsed): re-verified directly against the crates.io sparse index (not just
# `cargo info`) — datafusion's newest published version is now 54.1.0 (up
# from 54.0.0), but its manifest still declares `arrow = "^58.3.0"` /
# `arrow-schema = "^58.3.0"` (index.crates.io/da/ta/datafusion), so it has
# not moved to arrow 59. oxistore-columnar's newest published version is
# still 0.2.0 and still declares `arrow = "^59.0.0"`
# (index.crates.io/ox/is/oxistore-columnar) — no 0.1.x-line release has been
# cut that would narrow the gap either. The conflict is unchanged from the
# 2026-07-17 check. oxisql-datafusion/src/parquet.rs bridges
# oxistore_columnar::{Schema,RecordBatch} directly into datafusion/arrow
# types by relying on identical arrow versions; bumping to 0.2.0 breaks that
# bridge with E0308 (two `arrow_schema` versions in the dependency graph).
# Next re-check due 2026-09-04. See ~/work/cargo-upgrade/oxisql.toml for the
# tracked skip (external ledger file, not updated by this pass — see the
# hygiene-wave notes for why).
oxistore-columnar = { version = "0.1.3" }

# OxiStore cache eviction primitives (Pure Rust, LRU/ARC/LFU/W-TinyLFU).
# `oxisql-cache` builds SQL query-result / prepared-plan caching on top of
# this crate's `LruCache` + `Cache` trait. Direction is deliberately
# `oxisql-cache` -> `oxistore-cache` (crates.io), not the reverse: this is the
# sanctioned dependency-inversion fix for a former repo-level cycle where
# `oxistore-cache`'s now-removed `sql` feature depended back on
# `oxisql-core`. Default features only — the old `sql` feature (which pulled
# `oxisql-core` into `oxistore-cache` itself) is intentionally left disabled.
oxistore-cache = { version = "0.3.0" }

# ── Security patches ───────────────────────────────────────────────────────────
# RUSTSEC-2026-0104: rustls-webpki 0.102.x panic in CRL parsing.
# The CryptoProvider is now supplied CVE-clean by oxitls (via its published
# oxitls-rustcrypto-provider fork, webpki-free), so no rustls-rustcrypto patch
# is needed here anymore.
# ══ KNOWN PUBLISH HOLE — read before cutting a release ═════════════════════════
#
# Cargo `[patch]` sections are honoured ONLY at the root manifest of the
# workspace actually being built. They are stripped from a published `.crate`
# and are never inherited by a downstream consumer. Everything below therefore
# makes *this* repository's build Pure Rust and does nothing at all for anyone
# who depends on the published `oxisql*` crates from crates.io:
#
#   * `oxisql-postgres` (published) → tokio-postgres → whoami (upstream)
#     → objc2-system-configuration on macOS. C/ObjC binding, Pure Rust Policy
#     v2 §3 violation, silent — the downstream build simply succeeds.
#   * `oxisql-datafusion` with the `columnar`/`parquet` feature (published)
#     → arrow-ipc → zstd (upstream) → zstd-sys. C compile, same silence.
#
# What has been done about it (in decreasing order of strength):
#   1. Upstream removal was investigated for both and found not currently
#      possible — see the README version-history entries for
#      `objc2-system-configuration` (0.3.0) and `zstd-sys` (0.3.2).
#   2. README carries the exact copy-into-your-own-workspace-root recipe:
#      "Downstream `[patch.crates-io]` requirement (whoami / zstd)".
#   3. TODO.md's release checklist carries this hole as an explicit, still-open
#      pre-publish item ("KNOWN PUBLISH HOLE (whoami / zstd)").
#
# What actually CLOSES it (not done — requires publishing new crates, which is
# deliberately out of scope for any automated pass):
#   Mirror the rustls fix (Q1→Q2, which is what made `rustls-rustcrypto-patched`
#   disappear from this block): publish the two shims under package-renamed
#   names — `oxisql-whoami-compat` and `oxiarc-zstd-compat` — and consume them
#   through `package = "..."` renames in `crates/oxisql-postgres/Cargo.toml`
#   and `crates/oxisql-datafusion/Cargo.toml` respectively. A rename dependency
#   DOES travel with a published crate, so the hole closes for downstream
#   consumers too. Both `crates/whoami-patched` and `crates/zstd-shim` are
#   `publish = false` today precisely because that rename has not happened yet;
#   flipping them to publishable is step 1 of that work.
# ═══════════════════════════════════════════════════════════════════════════════
[patch.crates-io]
# Pure-Rust patch: drop objc2-system-configuration (macOS SCDynamicStore) from
# whoami's std feature — pulled via tokio-postgres; see COOLJAPAN Pure Rust Policy v2 §3 Role-A.
# LOCAL BUILD ONLY — see the publish-hole banner above.
whoami = { path = "crates/whoami-patched" }
# Pure-Rust patch: replace the C-FFI `zstd` (zstd-sys) with a pure shim backed by
# oxiarc-zstd; arrow-ipc (via datafusion) is the only consumer (COOLJAPAN Pure Rust v2).
# LOCAL BUILD ONLY — see the publish-hole banner above.
zstd = { path = "crates/zstd-shim" }

