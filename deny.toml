[bans]
deny = [
    { name = "libsqlite3-sys" },
    { name = "rusqlite" },
    { name = "openssl-sys" },
    { name = "native-tls" },
    { name = "ring" },
]

[licenses]
allow = [
    "Apache-2.0",
    "MIT",
    "ISC",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "Unicode-DFS-2016",
    "CC0-1.0",
]
confidence-threshold = 0.8
