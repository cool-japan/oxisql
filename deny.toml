[bans]
deny = [
    { name = "libsqlite3-sys" },
    { name = "rusqlite" },
    { name = "openssl-sys" },
    { name = "native-tls" },
    { name = "ring" },
    { name = "mimalloc" },
    { name = "libmimalloc-sys" },
    { name = "libgit2-sys" },
    { name = "libz-sys" },
    { name = "simsimd" },
]

[licenses]
allow = [
    "Apache-2.0",
    "MIT",
    "ISC",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "Zlib",
    "Unicode-3.0",
    # MPL-2.0: file-level copyleft, coexists with Apache-2.0 per MPL §3.3
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8
