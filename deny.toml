[advisories]
ignore = [
    # RUSTSEC-2023-0071: Marvin Attack (RSA PKCS#1 v1.5 timing side-channel) in
    # `rsa` 0.9.10, pulled in transitively via oxitls's `oxitls-rustcrypto-provider`
    # fork (TLS crypto provider for oxisql-postgres / oxisql-mysql). UNREACHABLE
    # here: OxiSQL only ever configures rustls as a *TLS client* — every
    # `ClientConfig` builder in this workspace calls `.with_no_client_auth()`
    # (see crates/oxisql-postgres/src/builder.rs, crates/oxisql-mysql/src/lib.rs)
    # — so rustls never performs client-certificate RSA private-key operations
    # (the only operation Marvin's timing side-channel targets). Server-certificate
    # RSA signature *verification* (the only RSA path actually exercised) is not
    # affected by this advisory. No upstream fix exists yet; re-check when
    # `oxitls-rustcrypto-provider` or `rsa` publishes a patched release.
    "RUSTSEC-2023-0071",
]

[bans]
deny = [
    { name = "libsqlite3-sys" },
    { name = "rusqlite" },
    { name = "openssl-sys" },
    { name = "native-tls" },
    { name = "ring" },
    { name = "mimalloc" },
    { name = "libmimalloc-sys" },
    { name = "libgit2-sys" },
    { name = "libz-sys" },
    { name = "simsimd" },
]

[licenses]
allow = [
    "Apache-2.0",
    "MIT",
    "ISC",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "CC0-1.0",
    "Zlib",
    "Unicode-3.0",
    # MPL-2.0: file-level copyleft, coexists with Apache-2.0 per MPL §3.3
    "MPL-2.0",
    "CDLA-Permissive-2.0",
]
confidence-threshold = 0.8
